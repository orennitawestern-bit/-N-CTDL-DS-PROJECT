
name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install MSYS2 and GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build EXE
        shell: msys2 {0}
        run: |
          g++ src/*.cpp -I include -std=c++17 -o main.exe -static -static-libgcc -static-libstdc++

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item main.exe dist/
          Copy-Item data dist/ -Recurse

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyHangKhong-Windows
          path: dist/
